<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notre site arrive bientôt.">
  <title>Bientôt disponible</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 650px;
      padding: 40px 20px;
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1;
    }

    p {
      margin: 0;
      font-size: 20px;
      line-height: 1.6;
      color: #aaa;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="badge">BIENTÔT</div>
    <h1>Quelque chose arrive.</h1>
    <p>Notre nouveau site est actuellement en préparation.</p>
  </main>
</body>
</html>
